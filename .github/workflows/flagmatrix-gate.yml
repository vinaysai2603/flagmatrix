name: FlagMatrix Release Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FlagMatrix
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run offline unit & regression tests
        run: pytest -m "not live" -v

  flagsmith-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FlagMatrix
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start isolated self-hosted Flagsmith
        run: |
          docker compose -f flagsmith/docker-compose.yml up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/liveness/ >/dev/null; then
              echo "Flagsmith is live"
              break
            fi
            sleep 3
          done

      - name: Bootstrap isolated CI admin & master API key
        id: bootstrap
        run: |
          PW="FlagMatrixCI_$(date +%s)!9"
          KEY=$(curl -fsS -X POST http://localhost:8000/api/v1/auth/users/ \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"ci@flagmatrix.local\",\"password\":\"$PW\",\"re_password\":\"$PW\",\"first_name\":\"CI\",\"last_name\":\"Bot\",\"superuser\":true}" \
            | python -c "import sys,json; print(json.load(sys.stdin)['key'])")
          ORG_ID=$(curl -fsS -X POST http://localhost:8000/api/v1/organisations/ \
            -H "Authorization: Token $KEY" -H "Content-Type: application/json" \
            -d '{"name":"FlagMatrix CI Org"}' \
            | python -c "import sys,json; print(json.load(sys.stdin)['id'])")
          API_KEY=$(curl -fsS -X POST "http://localhost:8000/api/v1/organisations/$ORG_ID/master-api-keys/" \
            -H "Authorization: Token $KEY" -H "Content-Type: application/json" \
            -d '{"name":"CI Gate","is_admin":true}' \
            | python -c "import sys,json; print(json.load(sys.stdin)['key'])")
          echo "::add-mask::$API_KEY"
          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"

      - name: Seed isolated FlagMatrix Demo project
        env:
          FLAGSMITH_API_URL: http://localhost:8000
          FLAGSMITH_API_KEY: ${{ steps.bootstrap.outputs.api_key }}
        run: python examples/seed_flagsmith.py

      - name: Demonstrate blocking gate on incompatible profile (expects exit 1)
        env:
          FLAGSMITH_API_URL: http://localhost:8000
          FLAGSMITH_API_KEY: ${{ steps.bootstrap.outputs.api_key }}
        run: |
          set +e
          flagmatrix validate \
            --profiles examples/profiles/novapay_android.yaml \
            --rules examples/rules.yaml \
            --env Production \
            --report-out blocked-report.json
          CODE=$?
          set -e
          echo "Blocked gate exit code: $CODE"
          test "$CODE" -eq 1

      - name: Demonstrate passing gate on compatible profile (expects exit 0)
        env:
          FLAGSMITH_API_URL: http://localhost:8000
          FLAGSMITH_API_KEY: ${{ steps.bootstrap.outputs.api_key }}
        run: |
          flagmatrix validate \
            --profiles examples/profiles/aurelia_ios.yaml \
            --rules examples/rules.yaml \
            --env Production \
            --report-out passed-report.json

      - name: Render Markdown summary
        if: always() && hashFiles('passed-report.json') != ''
        run: flagmatrix report passed-report.json --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagmatrix-ci-reports
          path: |
            blocked-report.json
            passed-report.json
