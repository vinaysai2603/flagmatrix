name: FlagMatrix Release Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  compatibility-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FlagMatrix
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run FlagMatrix unit & compatibility tests
        run: pytest tests/test_core_engine.py tests/test_cli.py tests/test_api.py

      - name: Validate isolated Flagsmith test environment (Release Gate)
        if: ${{ vars.FLAGSMITH_API_URL != '' }}
        env:
          FLAGSMITH_API_URL: ${{ vars.FLAGSMITH_API_URL }}
          FLAGSMITH_API_KEY: ${{ secrets.FLAGSMITH_API_KEY }}
        run: |
          flagmatrix validate \
            --config examples/flagmatrix.yaml \
            --profiles examples/profiles \
            --rules examples/rules.yaml \
            --env "${{ vars.FLAGSMITH_ENVIRONMENT || 'Test-Gate' }}" \
            --report-out flagmatrix-report.json

      - name: Render Markdown summary
        if: always() && hashFiles('flagmatrix-report.json') != ''
        run: |
          flagmatrix report flagmatrix-report.json --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility report artifact
        if: always() && hashFiles('flagmatrix-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: flagmatrix-compatibility-report
          path: flagmatrix-report.json
