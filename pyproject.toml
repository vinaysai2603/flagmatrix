[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flagmatrix"
version = "0.1.0"
description = "Open-source feature configuration compatibility toolkit for self-hosted Flagsmith"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "packaging>=24.0,<26.0",
    "semver>=3.0,<4.0",
    "httpx>=0.27,<1.0",
    "flagsmith>=3.0,<5.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
]

[project.scripts]
flagmatrix = "flagmatrix_cli.main:app"

[tool.setuptools.packages.find]
where = ["core", "cli", "api"]
include = ["flagmatrix_core*", "flagmatrix_cli*", "flagmatrix_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core", "cli", "api"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: integration tests requiring a running self-hosted Flagsmith instance",
]
